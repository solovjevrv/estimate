services:
  postgres:
    image: postgres:18-alpine
    container_name: poker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poker}
      POSTGRES_DB: ${POSTGRES_DB:-poker}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-poker} -d $${POSTGRES_DB:-poker}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Объектное хранилище (Epic 21) — аватарки/картинки досок/стикер-паки. Консоль
  # (9001) открыта наружу только здесь, для удобства локальной разработки — в
  # проде (docker-compose.prod.yml) MinIO не публикуется вовсе, только внутренняя сеть.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: poker-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Идемпотентный init: создаёт приватный бакет и учётку приложения (не root)
  # с правами только на этот бакет. Гоняется при каждом up, безопасно повторно.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    container_name: poker-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-poker-app}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-poker-app-secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-poker-assets}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
      mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
      printf "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"]}]}" "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/poker-app-policy.json &&
      mc admin policy create local poker-app-policy /tmp/poker-app-policy.json &&
      mc admin policy attach local poker-app-policy --user "$$MINIO_ACCESS_KEY"
      '

volumes:
  postgres_data:
  minio_data:
