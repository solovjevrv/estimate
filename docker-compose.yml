services:
  postgres:
    image: postgres:18-alpine
    container_name: estimate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-estimate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estimate}
      POSTGRES_DB: ${POSTGRES_DB:-estimate}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-estimate} -d $${POSTGRES_DB:-estimate}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres_data:
