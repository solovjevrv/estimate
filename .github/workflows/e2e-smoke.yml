name: E2E smoke

# Не только гейт релиза: основная ценность продукта — интерактивный холст, а он
# не покрыт unit-тестами настолько, чтобы ловить регрессии. Раньше браузерная
# проверка на PR в dev не запускалась вовсе (только на main и ночью), поэтому
# регрессии находил пользователь. Полный регресс остаётся ночным — здесь smoke.
on:
  pull_request:
    branches: [main, dev, '*-feature']

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: estimate
          POSTGRES_PASSWORD: estimate
          POSTGRES_DB: estimate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estimate -d estimate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://estimate:estimate@localhost:5432/estimate
      # Гейт релиза не связан с реальным OAuth — фейковый, но валидный по длине секрет
      JWT_SECRET: e2e-smoke-secret-подставной-но-длиннее-32-символов
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сервера
        run: pnpm --filter @estimate/server build

      - name: Установка браузера Playwright
        run: pnpm --filter @estimate/e2e exec playwright install --with-deps chromium

      - name: Smoke-тесты
        run: pnpm --filter @estimate/e2e test:smoke

      - name: Загрузить отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
