name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Деплои не параллелим и не отменяем на середине
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Настройка SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "ssh-keyscan не вернул ключей"; exit 1; }

      - name: Деплой
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/deploy.sh | tee deploy.log
          # Скрипт идёт по stdin: если его кто-то дочитает за нас, bash выйдет с нулём
          # на середине. Верим только явной отметке из последней строки скрипта
          if ! grep -q 'Деплой успешен' deploy.log; then
            echo 'ОШИБКА: скрипт деплоя не дошёл до конца'
            exit 1
          fi
