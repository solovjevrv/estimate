name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

# Деплои не параллелим и не отменяем на середине
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Деплой на VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Настройка SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Ключ сервера закреплён заранее (см. SSH_KNOWN_HOSTS) — без keyscan-а на
          # каждый деплой, который слепо доверяет первому ответу сервера (TOFU)
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [ -s ~/.ssh/known_hosts ] || { echo "SSH_KNOWN_HOSTS пуст"; exit 1; }

      - name: Обновление .env на сервере
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MINIO_ROOT_USER: ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD: ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # Без учёток MinIO docker-compose.prod.yml не соберётся (${VAR:?}) — падаем
          # здесь, с понятной причиной, а не посреди деплоя на сервере
          for var in MINIO_ROOT_USER MINIO_ROOT_PASSWORD MINIO_ACCESS_KEY MINIO_SECRET_KEY; do
            [ -n "${!var}" ] || { echo "Не задан секрет $var"; exit 1; }
          done
          # GitHub Secrets — источник правды; .env на сервере перезаписывается
          # каждым деплоем. printf трактует значение как данные, а не shell-код —
          # безопасно, даже если в секрете случайно окажутся `$()`/бэктики (в
          # отличие от heredoc, где такое раскрылось бы на раннере)
          {
            printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER"
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'YANDEX_CLIENT_ID=%s\n' "$YANDEX_CLIENT_ID"
            printf 'YANDEX_CLIENT_SECRET=%s\n' "$YANDEX_CLIENT_SECRET"
            printf 'SENTRY_DSN=%s\n' "$SENTRY_DSN"
            printf 'MINIO_ROOT_USER=%s\n' "$MINIO_ROOT_USER"
            printf 'MINIO_ROOT_PASSWORD=%s\n' "$MINIO_ROOT_PASSWORD"
            printf 'MINIO_ACCESS_KEY=%s\n' "$MINIO_ACCESS_KEY"
            printf 'MINIO_SECRET_KEY=%s\n' "$MINIO_SECRET_KEY"
            printf 'GIPHY_API_KEY=%s\n' "$GIPHY_API_KEY"
            printf 'TELEGRAM_BOT_TOKEN=%s\n' "$TELEGRAM_BOT_TOKEN"
          } | ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'cat > ~/estimate/.env && chmod 600 ~/estimate/.env'

      - name: Деплой
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -o pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ConnectTimeout=10 \
            "$SSH_USER@$SSH_HOST" 'bash -s' < scripts/deploy.sh | tee deploy.log
          # Скрипт идёт по stdin: если его кто-то дочитает за нас, bash выйдет с нулём
          # на середине. Верим только явной отметке из последней строки скрипта
          if ! grep -q 'Деплой успешен' deploy.log; then
            echo 'ОШИБКА: скрипт деплоя не дошёл до конца'
            exit 1
          fi
