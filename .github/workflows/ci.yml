name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линтер
        run: pnpm lint

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Проверка типов
        run: pnpm typecheck

      - name: Unit-тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
