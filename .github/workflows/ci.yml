name: CI

# Ветки накопления крупных фич (`<feature>-feature`, от dev) тоже под CI: без них
# PR внутрь такой ветки не проверялся вообще — эпики досок накопили 107 коммитов и
# +30k строк без единого прогона, а красный format:check всплыл бы только на мерже
# в dev. Push-триггер там же, чтобы прямые коммиты в ветку накопления не проскакивали.
on:
  pull_request:
    branches: [dev, main, '*-feature']
  push:
    branches: [dev, '*-feature']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Объектное хранилище (Epic 21) — интеграционный тест MinioObjectStorage
      # (apps/server/test/minio-object-storage.test.ts) гоняется против настоящего
      # MinIO, не только фейка. bitnami/minio, не minio/minio: у второго нет
      # дефолтной команды запуска, а служебные контейнеры GitHub Actions не
      # поддерживают переопределение command — только образ/env/ports/options.
      # MINIO_DEFAULT_BUCKETS сам создаёт бакет на старте (в CI бакет уже готов
      # к моменту тестов, отдельный init-job здесь не нужен — в отличие от
      # docker-compose, где под root-учётку заводится ограниченная app-учётка).
      minio:
        image: bitnami/minio:2025.4.8
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
          MINIO_DEFAULT_BUCKETS: poker-assets
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://poker:poker@localhost:5432/poker
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: poker-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Ждать готовности MinIO
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO не поднялся за 30с" >&2
          exit 1

      - name: Линтер
        run: pnpm lint

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Проверка типов
        run: pnpm typecheck

      # Разделены намеренно: unit не требует БД и падает быстрее, поэтому по
      # красной джобе сразу видно, сломана логика или интеграция с PostgreSQL.
      - name: Unit-тесты (без БД)
        run: pnpm test:unit

      - name: Тесты сервера (с PostgreSQL и MinIO)
        run: pnpm test:server

      - name: Сборка
        run: pnpm build
