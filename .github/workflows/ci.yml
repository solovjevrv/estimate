name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: estimate
          POSTGRES_PASSWORD: estimate
          POSTGRES_DB: estimate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estimate -d estimate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://estimate:estimate@localhost:5432/estimate
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линтер
        run: pnpm lint

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Проверка типов
        run: pnpm typecheck

      - name: Unit-тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
