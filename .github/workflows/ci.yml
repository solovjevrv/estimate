name: CI

# Ветки накопления крупных фич (`<feature>-feature`, от dev) тоже под CI: без них
# PR внутрь такой ветки не проверялся вообще — эпики досок накопили 107 коммитов и
# +30k строк без единого прогона, а красный format:check всплыл бы только на мерже
# в dev. Push-триггер там же, чтобы прямые коммиты в ветку накопления не проскакивали.
on:
  pull_request:
    branches: [dev, main, '*-feature']
  push:
    branches: [dev, '*-feature']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Линт, типы, тесты, сборка
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://poker:poker@localhost:5432/poker
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Линтер
        run: pnpm lint

      - name: Проверка форматирования
        run: pnpm format:check

      - name: Проверка типов
        run: pnpm typecheck

      # Разделены намеренно: unit не требует БД и падает быстрее, поэтому по
      # красной джобе сразу видно, сломана логика или интеграция с PostgreSQL.
      - name: Unit-тесты (без БД)
        run: pnpm test:unit

      - name: Тесты сервера (с PostgreSQL)
        run: pnpm test:server

      - name: Сборка
        run: pnpm build
