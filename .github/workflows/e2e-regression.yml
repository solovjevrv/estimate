name: E2E regression

on:
  schedule:
    # 03:00 UTC — вне рабочего времени, не мешает пушам/PR
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression:
    name: Полный набор (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: poker
          POSTGRES_PASSWORD: poker
          POSTGRES_DB: poker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poker -d poker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://poker:poker@localhost:5432/poker
      JWT_SECRET: e2e-regression-secret-подставной-но-длиннее-32-символов
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сервера
        run: pnpm --filter @poker/server build

      - name: Установка браузера Playwright
        run: pnpm --filter @poker/e2e exec playwright install --with-deps chromium

      - name: E2E-тесты (полный набор)
        run: pnpm --filter @poker/e2e test

      - name: Загрузить отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
