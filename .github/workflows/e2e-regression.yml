name: E2E regression

on:
  schedule:
    # 03:00 UTC — вне рабочего времени, не мешает пушам/PR
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  regression:
    name: Полный набор (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: estimate
          POSTGRES_PASSWORD: estimate
          POSTGRES_DB: estimate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U estimate -d estimate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Объектное хранилище (Epic 21): без него любая загрузка файла в e2e
      # (аватарка, картинка на доске) падала — регрессия была красной с 22.08.2026.
      # Настройка — как в ci.yml (образ pgsty, root-учётка на время джобы)
      minio:
        image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin123
        ports:
          - 9000:9000
        command: server /data
    env:
      DATABASE_URL: postgres://estimate:estimate@localhost:5432/estimate
      JWT_SECRET: e2e-regression-secret-подставной-но-длиннее-32-символов
      MINIO_ENDPOINT: localhost
      MINIO_PORT: 9000
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET: estimate-assets
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Ночной прогон — всегда dev; ручной запуск — выбранная ветка (проверить PR до мержа)
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - name: Установка pnpm
        uses: pnpm/action-setup@v4

      - name: Установка Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка сервера
        run: pnpm --filter @estimate/server build

      - name: Установка браузера Playwright
        run: pnpm --filter @estimate/e2e exec playwright install --with-deps chromium

      - name: E2E-тесты (полный набор)
        run: pnpm --filter @estimate/e2e test

      - name: Загрузить отчёт при падении
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report/
          retention-days: 7
