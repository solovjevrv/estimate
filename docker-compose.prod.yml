# Продакшен-стек. Секреты берутся из .env рядом с файлом (создаётся на сервере, в git не попадает).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Порт наружу не публикуется — БД доступна только контейнерам стека
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: estimate-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://estimate.solovyovdev.ru}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://estimate.solovyovdev.ru}
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - avatars_data:/app/apps/server/avatars
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: estimate-web
    restart: unless-stopped
    ports:
      # nginx-unprivileged слушает 8080/8443 внутри контейнера (не может биндиться на <1024)
      - '80:8080'
      - '443:8443'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    # Периодический reload, чтобы nginx подхватывал продлённые сертификаты
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Продление по webroot дважды в сутки; первый выпуск делается отдельной командой (см. README).
    # web работает под uid/gid 101 (nginx-unprivileged) и не может прочитать root:600 приватный
    # ключ, который пишет certbot, — поэтому при старте и после каждого продления (--deploy-hook)
    # отдаём группе 101 право на чтение
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      fix() { chown -R root:101 /etc/letsencrypt/live /etc/letsencrypt/archive; chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive; };
      fix;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook "chown -R root:101 /etc/letsencrypt/live /etc/letsencrypt/archive && chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive"; sleep 12h & wait $${!}; done'

  # Ежедневный бэкап БД и загруженных аватарок (10.15) на том же диске: раз в сутки
  # pg_dump + tar аватарок в отдельный volume, хранение 14 дней (find -mtime +14).
  # Не защищает от потери самого сервера/диска — только от порчи данных
  # багом/миграцией/человеческой ошибкой. Восстановление и офсайт-хранение — см. README «Продакшен».
  db-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_backups:/backups
      - avatars_data:/avatars:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
      pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "/backups/$$(date +%Y-%m-%d_%H%M%S).dump" && find /backups -name "*.dump" -mtime +14 -delete;
      tar -czf "/backups/avatars_$$(date +%Y-%m-%d_%H%M%S).tar.gz" -C /avatars . && find /backups -name "avatars_*.tar.gz" -mtime +14 -delete;
      sleep 24h & wait $${!}; done'

volumes:
  postgres_data:
  postgres_backups:
  avatars_data:
  letsencrypt:
  certbot_www:
