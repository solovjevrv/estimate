# Продакшен-стек. Секреты берутся из .env рядом с файлом (создаётся на сервере, в git не попадает).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    # Порт наружу не публикуется — БД доступна только контейнерам стека
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: poker-server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://estimate.solovyovdev.ru}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://estimate.solovyovdev.ru}
      JWT_SECRET: ${JWT_SECRET:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      # MinIO намеренно не подключен здесь (21.1): аватарки/картинки досок пока
      # пишутся на локальный диск (volumes ниже) — MINIO_ACCESS_KEY/SECRET_KEY
      # заводятся вместе с фактической миграцией сервисов (21.2/21.5), не раньше,
      # чтобы новая инфраструктура не становилась точкой отказа раньше, чем ею
      # начинают реально пользоваться.
    volumes:
      - avatars_data:/app/apps/server/avatars
      - board_assets_data:/app/apps/server/board-assets
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Объектное хранилище (Epic 21) — поднято, но пока не в горячем пути: до
  # миграции аватарок/картинок досок (21.2/21.5) `server` его не читает и не
  # пишет. API/консоль не публикуются — доступ только по внутренней сети Compose.
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Идемпотентный init: приватный бакет + учётка приложения (не root) с правами
  # только на этот бакет. Одноразовый — гоняется при каждом up, безопасно повторно.
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-poker-assets}
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
      mc admin user add local "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY" &&
      printf "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Action\":[\"s3:GetObject\",\"s3:PutObject\",\"s3:DeleteObject\",\"s3:ListBucket\"],\"Resource\":[\"arn:aws:s3:::%s\",\"arn:aws:s3:::%s/*\"]}]}" "$$MINIO_BUCKET" "$$MINIO_BUCKET" > /tmp/poker-app-policy.json &&
      mc admin policy create local poker-app-policy /tmp/poker-app-policy.json &&
      mc admin policy attach local poker-app-policy --user "$$MINIO_ACCESS_KEY"
      '

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: poker-web
    restart: unless-stopped
    ports:
      # nginx-unprivileged слушает 8080/8443 внутри контейнера (не может биндиться на <1024)
      - '80:8080'
      - '443:8443'
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      server:
        condition: service_healthy
    # Периодический reload, чтобы nginx подхватывал продлённые сертификаты
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Продление по webroot дважды в сутки; первый выпуск делается отдельной командой (см. README).
    # web работает под uid/gid 101 (nginx-unprivileged) и не может прочитать root:600 приватный
    # ключ, который пишет certbot, — поэтому при старте и после каждого продления (--deploy-hook)
    # отдаём группе 101 право на чтение
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      fix() { chown -R root:101 /etc/letsencrypt/live /etc/letsencrypt/archive; chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive; };
      fix;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet --deploy-hook "chown -R root:101 /etc/letsencrypt/live /etc/letsencrypt/archive && chmod -R g+rX /etc/letsencrypt/live /etc/letsencrypt/archive"; sleep 12h & wait $${!}; done'

  # Ежедневный бэкап БД и загруженных аватарок (10.15) и картинок досок (13.2) на том же диске: раз в сутки
  # pg_dump + tar аватарок + tar картинок досок в отдельные volume, хранение 14 дней (find -mtime +14).
  # Не защищает от потери самого сервера/диска — только от порчи данных
  # багом/миграцией/человеческой ошибкой. Восстановление и офсайт-хранение — см. README «Продакшен».
  db-backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_backups:/backups
      - avatars_data:/avatars:ro
      - board_assets_data:/board-assets:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      while :; do
      pg_dump -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Fc -f "/backups/$$(date +%Y-%m-%d_%H%M%S).dump" && find /backups -name "*.dump" -mtime +14 -delete;
      tar -czf "/backups/avatars_$$(date +%Y-%m-%d_%H%M%S).tar.gz" -C /avatars . && find /backups -name "avatars_*.tar.gz" -mtime +14 -delete;
      tar -czf "/backups/board-assets_$$(date +%Y-%m-%d_%H%M%S).tar.gz" -C /board-assets . && find /backups -name "board-assets_*.tar.gz" -mtime +14 -delete;
      sleep 24h & wait $${!}; done'

  # Бэкап бакета MinIO (21.1) — тем же принципом, что и db-backup выше: ежедневный
  # локальный снимок, хранение 14 дней, не защита от потери диска целиком. Пока
  # бакет пуст (аватарки/картинки ещё не мигрированы, 21.2/21.5) — снимает пустые
  # срезы, механизм проверен заранее, а не в момент, когда в бакете уже есть данные.
  minio-backup:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?}
      MINIO_BUCKET: ${MINIO_BUCKET:-poker-assets}
    volumes:
      - object_storage_backups:/backups
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: >
      /bin/sh -c 'trap exit TERM;
      mc alias set local http://minio:9000 "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY";
      while :; do
      mc mirror --quiet "local/$$MINIO_BUCKET" "/backups/$$(date +%Y-%m-%d_%H%M%S)" && find /backups -maxdepth 1 -mindepth 1 -mtime +14 -exec rm -rf {} \;;
      sleep 24h & wait $${!}; done'

volumes:
  postgres_data:
  postgres_backups:
  avatars_data:
  board_assets_data:
  minio_data:
  object_storage_backups:
  letsencrypt:
  certbot_www:
