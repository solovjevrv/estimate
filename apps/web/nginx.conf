# Экземпляры сервера (10.18). ip_hash — один клиент всегда на одном экземпляре:
# Socket.io начинает с long-polling, и все запросы одной сессии обязаны попасть
# туда, где она открыта. Лёг экземпляр — запрос уходит на соседний.
# resolve + resolver Docker: адреса перечитываются на лету — после пересоздания
# контейнера при деплое nginx не держит старый IP, и не падает на старте, если
# какой-то экземпляр ещё не поднят
upstream estimate_server {
  zone estimate_server 64k;
  resolver 127.0.0.11 valid=10s ipv6=off;
  ip_hash;
  server server-1:3000 resolve;
  server server-2:3000 resolve;
}

# Порт 8080 (снаружи — 80): ACME-челленджи Let's Encrypt, healthcheck и редирект на HTTPS.
# Непривилегированный nginx не может слушать порты <1024, поэтому маппинг на хосте — 80:8080/443:8443
server {
  listen 8080;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /health {
    proxy_pass http://estimate_server;
  }

  location / {
    return 301 https://estimate.solovyovdev.ru$request_uri;
  }
}

# Порт 8443 (снаружи — 443): основное приложение по TLS, чистый URL без порта
server {
  listen 8443 ssl;
  http2 on;
  server_name estimate.solovyovdev.ru;

  ssl_certificate /etc/letsencrypt/live/estimate.solovyovdev.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/estimate.solovyovdev.ru/privkey.pem;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Хэшированные ассеты кэшируем навечно, index.html — всегда перепроверяется
  location /assets/ {
    expires max;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  location /api/ {
    # Дефолт nginx — 1 МБ: картинки досок (до 8 МБ), аватарки (до 8 МБ) и превью
    # досок (до 2 МБ) отбивались бы 413 ещё до сервера. Точные лимиты — на сервере
    client_max_body_size 10m;
    proxy_pass http://estimate_server;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://estimate_server;
  }

  location /socket.io/ {
    proxy_pass http://estimate_server;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
