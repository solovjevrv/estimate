# Порт 80: ACME-челленджи Let's Encrypt, healthcheck и редирект на HTTPS
server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location = /health {
    proxy_pass http://server:3000;
  }

  location / {
    return 301 https://$host:3000$request_uri;
  }
}

# Порт 3000: основное приложение по TLS (443/8443 на сервере заняты)
server {
  listen 3000 ssl;
  http2 on;
  server_name pokerplan.solovyovdev.ru;

  ssl_certificate /etc/letsencrypt/live/pokerplan.solovyovdev.ru/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/pokerplan.solovyovdev.ru/privkey.pem;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

  # Хэшированные ассеты кэшируем навечно, index.html — всегда перепроверяется
  location /assets/ {
    expires max;
    add_header Cache-Control 'public, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-cache';
  }

  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://server:3000;
  }

  # WebSocket-подключения Socket.io (появятся в задаче 2.1)
  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
