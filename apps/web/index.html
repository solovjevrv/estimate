<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EstiMate</title>
    <!--
      Статичный шел — единственное, что видят боты без выполнения JS (превью
      ссылок в мессенджерах/соцсетях, часть поисковых краулеров). Заголовок
      вкладки внутри самого приложения переключается реактивно (см. App.vue),
      но эти теги не могут зависеть от выбранного языка — пишем на русском
      как языке по умолчанию (см. <html lang>).
    -->
    <meta
      name="description"
      content="EstiMate — покер планирования для agile-команд: голосуйте картами, вскрывайте оценки и синхронизируйтесь в реальном времени. Гостю достаточно одной ссылки — без регистрации."
    />
    <link rel="canonical" href="https://estimate.solovyovdev.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://estimate.solovyovdev.ru/" />
    <meta property="og:site_name" content="EstiMate" />
    <meta property="og:title" content="EstiMate — Planning Poker для agile-команд" />
    <meta
      property="og:description"
      content="Голосуйте картами, вскрывайте оценки и синхронизируйтесь в реальном времени. Гостю достаточно одной ссылки."
    />
    <meta
      property="og:image"
      content="https://estimate.solovyovdev.ru/hero-illustration-light.webp"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EstiMate — Planning Poker для agile-команд" />
    <meta
      name="twitter:description"
      content="Голосуйте картами, вскрывайте оценки и синхронизируйтесь в реальном времени. Гостю достаточно одной ссылки."
    />
    <meta
      name="twitter:image"
      content="https://estimate.solovyovdev.ru/hero-illustration-light.webp"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Применяем сохранённую тему синхронно, до отрисовки Vue-приложения,
      // чтобы страница не мигала неверной темой на загрузке
      (function () {
        try {
          var mode = localStorage.getItem('estimate:theme');
          var dark =
            mode === 'dark' ||
            (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          // Хранилище недоступно — останемся на системной теме по умолчанию
        }
      })();
    </script>
    <!-- isolate держит всплывающие элементы Nuxt UI в своём контексте наложения -->
    <div id="app" class="isolate"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
